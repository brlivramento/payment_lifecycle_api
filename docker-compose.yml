services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment_lifecycle_api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://payments:payments@postgres:5432/payments?schema=public
      PORT: 3000
      NODE_ENV: development
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: payment_lifecycle_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  node_modules: